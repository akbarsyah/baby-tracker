idth:min(760px,100%);display:grid;grid-template-columns:repeat(4,1fr)}.nav-btn{border:0;background:transparent;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px}.nav-btn .nav-icon{font-size:19px}.nav-btn.active{color:var(--accent);font-weight:750}.fab{position:fixed;right:18px;bottom:calc(var(--nav) + env(safe-area-inset-bottom) + 14px);z-index:19;border:0;background:var(--text);color:var(--bg);width:48px;height:48px;border-radius:15px;font-size:23px;box-shadow:var(--shadow)}.modal-wrap{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.48);display:none;align-items:flex-end}.modal-wrap.show{display:flex}.modal{background:var(--surface);width:100%;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:20px 18px calc(22px + env(safe-area-inset-bottom));animation:up .18s ease}@keyframes up{from{transform:translateY(20px);opacity:.7}to{transform:none;opacity:1}}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.modal-close{border:0;background:var(--surface2);width:34px;height:34px;border-radius:10px}.form{display:grid;gap:12px}.field{display:grid;gap:6px}.field label{font-size:13px;font-weight:700}.field input,.field select,.field textarea{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 12px;outline:none}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 16%,transparent)}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 14px;font-weight:700}.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}.btn.danger{background:var(--danger-soft);color:var(--danger);border-color:transparent}.btn-row{display:flex;gap:9px;justify-content:flex-end;flex-wrap:wrap;margin-top:4px}.segmented{display:grid;g .icon-btn{padding:9px 13px;min-height:40px;font-size:13px}.bar{border-radius:0}.bar-label,.bar-value{font-size:11px}.modal{max-height:92dvh}.quick-grid{grid-template-columns:repeat(4,1fr)}.quick.wide{grid-column:1/-1;min-height:84px;font-size:18px;flex-direction:row;gap:10px}.fab{display:none}.segmented button.active{background:var(--accent-soft)}

<script>
const KEY='babyDailyTracker.v1';
const D={'Chronological age':'usia kronologis','Personal baby journal':'Jurnal bayi pribadi','Keep track of your baby’s day, from sleep and feeds to diapers and little moments. See patterns over time and know what to pay attention to next.':'Catat keseharian si kecil—mulai dari tidur, minum, dan popok hingga hal-hal kecil yang ingin Anda ingat. Lihat polanya dari waktu ke waktu dan ketahui apa yang perlu diperhatikan selanjutnya.','Your data stays on this device. This tracker is not a medical diagnostic tool and does not replace professional advice.':'Data Anda tersimpan di perangkat ini. Aplikasi ini bukan alat diagnosis medis dan tidak menggantikan saran profesional.','Create baby profile':'Buat profil bayi','Baby name':'Nama bayi',"Baby's name":'Nama bayi','Date of birth':'Tanggal lahir','Sex':'Jenis kelamin','Boy':'Laki-laki','Girl':'Perempuan','Female':'Perempuan','Male':'Laki-laki','Feeding method':'Cara pemberian makan','Breastfeeding':'Menyusui','Formula':'Susu formula','Combination':'Kombinasi','Not started':'Belum mulai','Started':'Sudah mulai','Gestational age at birth':'Usia kehamilan saat lahir','optional':'opsional','e.g. 39':'mis. 39','Allergies / conditions':'Alergi / kondisi','Optional':'Opsional','Today':'Hari ini','History':'Riwayat','Insights':'Wawasan','Settings':'Pengaturan','💤 Sleeping':'💤 Tidur','☀️ Awake':'☀️ Terjaga','Ready to record':'Siap mencatat','Tap what happened next.':'Ketuk apa yang terjadi berikutnya.','Sleep':'Tidur','Wake':'Bangun','Milk':'Susu','Diaper':'Popok','Note':'Catatan','Now':'Sekarang','When did it happen?':'Kapan terjadinya?','Next consideration':'Pertimbangan berikutnya','Today at a glance':'Ringkasan hari ini','Daytime sleep':'Tidur siang','Milk events':'Catatan susu','MPASI events':'Catatan MPASI','Diaper events':'Catatan popok','Bedtime consideration':'Pertimbangan waktu tidur malam','Timeline':'Lini masa','No events recorded yet today.':'Belum ada catatan hari ini.','Tap an action above when something happens.':'Ketuk tombol di atas saat sesuatu terjadi.','ongoing':'berlangsung','Nap':'Tidur siang','Night sleep':'Tidur malam','Breastfeeding ':'Menyusui','Bottle':'Botol','Pumping':'Memerah ASI','Left':'Kiri','Right':'Kanan','Both':'Keduanya','Wet':'Basah','Dirty':'Kotor','Breast milk':'ASI','Edit':'Ubah','Delete':'Hapus','Estimated':'Perkiraan','Confirmed':'Pasti','Your record':'Catatan Anda','Review previous days without turning them into a rigid schedule.':'Tinjau hari-hari sebelumnya tanpa menjadikannya jadwal kaku.','No previous events yet.':'Belum ada catatan sebelumnya.','Naps':'Tidur siang','No events.':'Tidak ada catatan.','Patterns, not rules':'Pola, bukan aturan','Only recurring signals should be treated as patterns.':'Hanya sinyal yang berulang yang dianggap pola.','Not enough history yet':'Riwayat belum cukup','A few days are needed before the app should call something a pattern.':'Perlu beberapa hari data sebelum aplikasi menyebut sesuatu sebagai pola.','Daytime sleep — recent days':'Tidur siang — beberapa hari terakhir','Recent average':'Rata-rata terkini','Range':'Rentang','How to read this':'Cara membaca ini','Variation from one day to another is normal. Repeated changes across several days are more informative. This tracker does not diagnose overtiredness, undertiredness, feeding adequacy, or illness.':'Variasi antarhari itu normal. Perubahan yang berulang selama beberapa hari lebih informatif. Aplikasi ini tidak mendiagnosis kelelahan, kurang mengantuk, kecukupan makan, atau penyakit.','Preferences & data':'Preferensi & data','Appearance':'Tampilan','System':'Sistem','Light':'Terang','Dark':'Gelap','Language':'Bahasa','Baby profile':'Profil bayi','Export data':'Ekspor data','Download a JSON backup of your local records.':'Unduh cadangan JSON dari catatan lokal Anda.','Import data':'Impor data','Restore a previously exported JSON backup.':'Pulihkan cadangan JSON yang pernah diekspor.','Clear all data':'Hapus semua data','Permanently remove the baby profile and events from this device.':'Hapus permanen profil bayi dan catatan dari perangkat ini.','About':'Tentang','Local-first personal tracker.':'Pencatat pribadi yang menyimpan data lokal.','Safety note: sleep guidance is informational. Always prioritise established safe-sleep practices and professional medical advice when a baby is unwell or symptoms are concerning.':'Catatan keselamatan: panduan tidur hanya informasi. Selalu utamakan praktik tidur aman yang sudah mapan dan saran medis profesional bila bayi sakit atau gejalanya mengkhawatirkan.','Record milk':'Catat susu','Edit milk':'Ubah susu','Record MPASI':'Catat MPASI','Edit MPASI':'Ubah MPASI','Record diaper':'Catat popok','Edit diaper':'Ubah popok','Add note':'Tambah catatan','Edit note':'Ubah catatan','Edit sleep':'Ubah tidur','Edit wake':'Ubah bangun','Date':'Tanggal','Time':'Jam','Confidence':'Tingkat kepastian','Type':'Jenis','Duration':'Durasi','Side':'Sisi','Not recorded':'Tidak dicatat','Volume':'Volume','Notes':'Catatan','Cancel':'Batal','Save':'Simpan','Save profile':'Simpan profil','Menu':'Menu','Texture':'Tekstur','Amount':'Jumlah','Response / possible reaction':'Respons / kemungkinan reaksi','End time':'Jam selesai','Sleep type':'Jenis tidur','minutes':'menit','e.g. rice, egg, avocado':'mis. nasi, telur, alpukat','mashed, soft, finger food':'lumat, lunak, finger food','liked it, gagged, rash, etc.':'suka, tersedak, ruam, dll.','If there is swelling, trouble breathing, or repeated vomiting after a new food, seek urgent medical care.':'Jika ada bengkak, sulit bernapas, atau muntah berulang setelah makanan baru, segera cari pertolongan medis.','Language ':'Bahasa','Theme':'Tema','Sleeping now. Let the baby’s cues guide the next transition.':'Bayi sedang tidur. Biarkan tanda dari bayi memandu transisi berikutnya.','Start by recording the morning wake or first sleep period.':'Mulai dengan mencatat bangun pagi atau tidur pertama.','Sleep started':'Tidur dimulai','Wake recorded':'Bangun dicatat','Milk event saved':'Catatan susu disimpan','Event saved':'Catatan disimpan','Sleep corrected':'Tidur dikoreksi','Wake corrected':'Bangun dikoreksi','Event deleted':'Catatan dihapus','Profile updated':'Profil diperbarui','Backup exported':'Cadangan diekspor','Backup imported':'Cadangan diimpor','End time must be after start time.':'Jam selesai harus setelah jam mulai.','This sleep has been running a long time. Please set when the baby woke.':'Tidur ini berjalan sangat lama. Mohon atur kapan bayi bangun.','That file is not a valid Baby Daily Tracker backup.':'Berkas itu bukan cadangan Baby Daily Tracker yang valid.','Replace current local data with this backup?':'Ganti data lokal saat ini dengan cadangan ini?','Clear the baby profile and all recorded events from this device? This cannot be undone unless you have an export.':'Hapus profil bayi dan semua catatan dari perangkat ini? Tidak dapat dibatalkan kecuali Anda punya ekspor.','Could not save to this device. Export a backup if possible.':'Gagal menyimpan ke perangkat ini. Ekspor cadangan jika bisa.'};
const R=[[/^(\d+) months (\d+) days$/,'$1 bulan $2 hari'],[/^(\d+) weeks (\d+) days$/,'$1 minggu $2 hari'],[/^Awake for (.+)$/,'Terjaga selama $1'],[/^Started (.+)$/,'Mulai $1'],[/^(\d+) completed naps$/,'$1 tidur siang selesai'],[/^(\d+) naps$/,'$1 tidur siang'],[/^(.+) daytime sleep$/,'$1 tidur siang'],[/^(\d+) milk$/,'$1 susu'],[/^wake window (.+)$/,'jendela terjaga $1'],[/^(\d+) min ago$/,'$1 mnt lalu'],[/^(\d+) min$/,'$1 mnt'],[/^Sleep recorded$/,'Tidur dicatat'],[/^(\d+) days? with completed naps recorded\..*$/,'$1 hari dengan tidur siang tercatat (hari ini tidak dihitung). Perlu beberapa hari data sebelum aplikasi menyebut sesuatu sebagai pola.'],[/^Delete (.+) at (\S+)\?$/,'Hapus $1 pukul $2?'],[/^A reasonable sleep opportunity may be around (\S+)–(\S+)\. Watch sleepy cues rather than treating this as a deadline\.$/,'Waktu tidur yang wajar mungkin sekitar $1–$2. Perhatikan tanda mengantuk, bukan sebagai tenggat.'],[/^Within the typical range for this age \(until about (\S+)\)\. Watch sleepy cues rather than treating this as a deadline\.$/,'Masih dalam rentang umum untuk usia ini (hingga sekitar $1). Perhatikan tanda mengantuk, bukan sebagai tenggat.'],[/^Past the typical range for this age \(it ended around (\S+)\)\. Look for sleepy cues; every baby varies\.$/,'Sudah lewat rentang umum untuk usia ini (berakhir sekitar $1). Perhatikan tanda mengantuk; setiap bayi berbeda.'],[/^If the nap that ended at (\S+) turns out to be the last one, bedtime may fit around (\S+)–(\S+)\. Adjust to sleepy cues\.$/,'Jika tidur siang yang berakhir pukul $1 ternyata yang terakhir, waktu tidur malam mungkin sekitar $2–$3. Sesuaikan dengan tanda mengantuk.']];
const LANG=()=>state.lang||((navigator.language||'').startsWith('id')?'id':'en'),LOC=()=>LANG()==='id'?'id-ID':'en-GB';
function tx1(k){let t=k.trim();if(D[t])return k.replace(t,D[t]);for(const[r,v]of R)if(r.test(t))return k.replace(t,t.replace(r,v));return k}
function tx(s){if(LANG()!=='id'||typeof s!=='string')return s;let r=tx1(s);if(r!==s)return r;return s.includes(' · ')?s.split(' · ').map(tx1).join(' · '):s}
function trDom(r){if(!r||LANG()!=='id')return;const w=document.createTreeWalker(r,NodeFilter.SHOW_TEXT),a=[];let n;while(n=w.nextNode())a.push(n);a.forEach(n=>{const p=n.parentNode;if(p.tagName==='OPTION'&&!p.hasAttribute('value'))p.setAttribute('value',n.nodeValue.trim());const v=tx(n.nodeValue);if(v!==n.nodeValue)n.nodeValue=v});r.querySelectorAll('[placeholder],[aria-label]').forEach(el=>['placeholder','aria-label'].forEach(k=>el.hasAttribute(k)&&el.setAttribute(k,tx(el.getAttribute(k)))))}
const _cf=window.confirm.bind(window);window.confirm=m=>_cf(tx(m));
function setLang(l){state.lang=l;save();render()}function toggleLang(){setLang(LANG()==='id'?'en':'id')}
function toggleTheme(){state.theme=document.documentElement.dataset.theme==='dark'?'light':'dark';save();render()}

const defaultState={profile:null,events:[],theme:'system'};
let state=load(); let activeScreen='today'; let tick=null;
function load(){try{return {...defaultState,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{try{localStorage.setItem(KEY+'.corrupt',localStorage.getItem(KEY))}catch{}return {...defaultState}}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){toast('Could not save to this device. Export a backup if possible.')}}
function esc(v=''){return String(v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function uid(){return crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random().toString(16).slice(2)}
function nowISO(){return new Date().toISOString()}
function localParts(d=new Date()){return {date:d.toLocaleDateString('en-CA'),time:d.toTimeString().slice(0,5)}}
function parseLocal(date,time){return new Date(`${date}T${time}:00`)}
function fmtTime(iso){return new Date(iso).toLocaleTimeString(LOC(), {hour:'2-digit',minute:'2-digit',hour12:false})}
function fmtDate(date){return new Date(date+'T12:00:00').toLocaleDateString(LOC(), {weekday:'short',month:'short',day:'numeric'})}
function mins(ms){return Math.max(0,Math.round(ms/60000))}
function dur(ms){let m=mins(ms),h=Math.floor(m/60),r=m%60,j=LANG()==='id'?'j':'h';return h?`${h}${j} ${r}m`:`${r}m`}
function ageFromDob(dob){let d=new Date(dob+'T00:00:00'),n=new Date();n=new Date(n.getFullYear(),n.getMonth(),n.getDate());let months=(n.getFullYear()-d.getFullYear())*12+n.getMonth()-d.getMonth();if(n.getDate()<d.getDate())months--;let a=new Date(d.getFullYear(),d.getMonth()+months,1);a.setDate(Math.min(d.getDate(),new Date(a.getFullYear(),a.getMonth()+1,0).getDate()));let tot=Math.round((n-d)/864e5);return {months,days:Math.round((n-a)/864e5),weeks:Math.floor(tot/7),wd:tot%7}}
function daysSince(dob){return Math.floor((Date.now()-new Date(dob+'T00:00:00'))/86400000)}
function today(){return localParts().date}
function dayEvents(date=today()){return state.events.filter(e=>e.date===date).sort((a,b)=>new Date(a.start)-new Date(b.start))}
function sleepEvents(date=today()){return dayEvents(date).filter(e=>e.type==='sleep')}
function activeSleep(){return state.events.find(e=>e.type==='sleep'&&!e.end)}
function lastWakeBefore(ts){return state.events.filter(e=>e.type==='wake'&&new Date(e.start)<=new Date(ts)).sort((a,b)=>new Date(b.start)-new Date(a.start))[0]}
function precedingWake(s){let t=+new Date(s),c=state.events.flatMap(e=>e.type==='sleep'&&e.end?[+new Date(e.end)]:e.type==='wake'?[+new Date(e.start)]:[]).filter(x=>x<=t);return c.length?t-Math.max(...c):null}
function awakeSince(){let c=state.events.flatMap(e=>e.type==='sleep'&&e.end?[+new Date(e.end)]:e.type==='wake'?[+new Date(e.start)]:[]);return c.length?Math.max(...c):null}
function sleepKind(e){if(e.kind)return e.kind;let h=new Date(e.start).getHours();return h>=18||h<5?'night':'nap'}
let ago=0;function setAgo(m){ago=m;renderScreen()}
function toggleSleep(){let a=activeSleep(),d=new Date(Date.now()-ago*6e4),est=ago>0?'estimated':'confirmed';if(a){if(d<=new Date(a.start)){toast('End time must be after start time.');return}if(d-new Date(a.start)>14*36e5){toast('This sleep has been running a long time. Please set when the baby woke.');openSleepEdit(a);return}a.end=d.toISOString();a.date=localParts(new Date(a.start)).date;if(est==='estimated')a.confidence=est;save();toast('Sleep recorded · '+dur(d-new Date(a.start)))}else{let h=d.getHours();state.events.push({id:uid(),type:'sleep',kind:h>=18||h<5?'night':'nap',start:d.toISOString(),end:null,date:localParts(d).date,confidence:est,createdAt:nowISO()});save();toast('Sleep started')}ago=0;renderScreen()}
function sleepSummary(date=today()){
let ss=sleepEvents(date).filter(e=>e.end&&sleepKind(e)==='nap');let total=ss.reduce((a,e)=>a+(new Date(e.end)-new Date(e.start)),0);return {ss,total,naps:ss.length}}
function wakeWindowRange(){let age=state.profile?ageFromDob(state.profile.dob).months:0;if(age<2)return [45,90];if(age<4)return [75,120];if(age<6)return [120,180];if(age<9)return [150,210];if(age<12)return [180,240];return [210,300]}
function nextSleepText(){if(activeSleep())return 'Sleeping now. Let the baby’s cues guide the next transition.';let a=awakeSince();if(!a)return 'Start by recording the morning wake or first sleep period.';let [lo,hi]=wakeWindowRange(),S=new Date(a+lo*6e4),E=new Date(a+hi*6e4),n=Date.now(),f=d=>fmtTime(d.toISOString());if(n<S)return `A reasonable sleep opportunity may be around ${f(S)}–${f(E)}. Watch sleepy cues rather than treating this as a deadline.`;if(n<=E)return `Within the typical range for this age (until about ${f(E)}). Watch sleepy cues rather than treating this as a deadline.`;return `Past the typical range for this age (it ended around ${f(E)}). Look for sleepy cues; every baby varies.`}
function bedtimeText(){let l=sleepSummary().ss.slice().sort((a,b)=>new Date(b.end)-new Date(a.end))[0];if(!l)return '';let [lo,hi]=wakeWindowRange(),e=+new Date(l.end),f=t=>fmtTime(new Date(t).toISOString());return `If the nap that ended at ${f(e)} turns out to be the last one, bedtime may fit around ${f(e+lo*6e4)}–${f(e+hi*6e4)}. Adjust to sleepy cues.`}
function eventIcon(type){return {sleep:'💤',wake:'☀️',breastfeed:'🍼',bottle:'🍼',pump:'◌',milk:'🍼',mpasi:'🍽️',diaper:'🧷',note:'📝'}[type]||'•'}
function eventTitle(e){if(e.type==='sleep')return sleepKind(e)==='night'?'Night sleep':'Nap';return {wake:'Wake',breastfeed:'Breastfeeding',bottle:'Bottle',pump:'Pumping',milk:'Milk',mpasi:'MPASI',diaper:'Diaper',note:'Note'}[e.type]||e.type}
function eventDetail(e){let a=[],p=e.confidence==='estimated'?'~':'';if(e.type==='sleep'&&e.end){a.push(p+dur(new Date(e.end)-new Date(e.start)));let w=precedingWake(e.start);if(w!=null)a.push(`wake window ${p}${dur(w)}`)}if(e.type==='breastfeed'){if(e.duration)a.push(`${e.duration} min`);if(e.side)a.push(tx(e.side))}if(e.type==='bottle'){if(e.volume)a.push(`${e.volume} ml`);if(e.kind)a.push(tx(e.kind))}if(e.type==='pump'){if(e.duration)a.push(`${e.duration} min`);if(e.volume)a.push(`${e.volume} ml`)}if(e.type==='mpasi'){if(e.menu)a.push(e.menu);if(e.amount)a.push(e.amount);if(e.texture)a.push(e.texture)}if(e.type==='diaper')a.push(tx(e.kind));if(e.notes)a.push(e.notes);return a.join(' · ')}
function confidenceLabel(c){return c==='estimated'?'Estimated':c==='calculated'?'Calculated':'Confirmed'}
function render(){applyTheme();if(!state.profile)return renderGate();document.getElementById('root').innerHTML=appShell();go(activeScreen)}
function applyTheme(){let root=document.documentElement,dark=state.theme==='dark'||(state.theme!=='light'&&matchMedia('(prefers-color-scheme: dark)').matches);root.dataset.theme=dark?'dark':'light';root.lang=LANG();document.getElementById('themeColor').content=dark?'#171715':'#f7f5f1'}
function renderGate(){_renderGate();document.querySelector('.gate').insertAdjacentHTML('afterbegin',`<div style="display:flex;gap:6px;justify-content:flex-end;margin-bottom:8px"><button type="button" class="icon-btn" onclick="toggleLang()">${LANG()==='id'?'EN':'ID'}</button><button type="button" class="icon-btn" onclick="toggleTheme()">${document.documentElement.dataset.theme==='dark'?'☀':'☾'}</button></div>`);trDom(document.getElementById('root'))}
function _renderGate(){document.getElementById('root').innerHTML=`<main class="profile-gate"><section class="gate"><div class="gate-mark">🍼</div><div class="eyebrow">Personal baby journal</div><h1>Baby Daily Tracker</h1><p>Keep track of your baby’s day, from sleep and feeds to diapers and little moments. See patterns over time and know what to pay attention to next.</p><div class="notice">Your data stays on this device. This tracker is not a medical diagnostic tool and does not replace professional advice.</div><form class="form" style="margin-top:16px" onsubmit="createProfile(event)">${profileFields(true)}<button class="btn primary" type="submit">Create baby profile</button></form></section></main>`}
function profileFields(required=false){return `<div class="field"><label>Baby name</label><input id="pName" required value="${esc(state.profile?.name||'')}" placeholder="Baby's name"></div><div class="row"><div class="field"><label>Date of birth</label><input id="pDob" type="date" required value="${esc(state.profile?.dob||'')}"></div><div class="field"><label>Sex</label><select id="pSex"><option value="boy">Boy</option><option value="girl">Girl</option></select></div></div><div class="field"><label>Feeding method</label><select id="pFeed"><option>Breastfeeding</option><option>Formula</option><option>Combination</option></select></div><div class="field"><label>MPASI</label><select id="pMpasi"><option value="not_started">Not started</option><option value="started">Started</option></select></div><div class="row"><div class="field"><label>Gestational age at birth <span class="muted">optional</span></label><input id="pGa" type="number" min="20" max="45" placeholder="e.g. 39" value="${state.profile?.ga||''}"></div><div class="field"><label>Allergies / conditions <span class="muted">optional</span></label><input id="pMed" placeholder="Optional" value="${esc(state.profile?.medical||'')}"></div></div>`}
function createProfile(ev){ev.preventDefault();state.profile={name:pName.value.trim(),dob:pDob.value,sex:(pSex.value==='male'||pSex.value==='boy')?'boy':'girl',feeding:pFeed.value,mpasi:pMpasi.value,ga:pGa.value?Number(pGa.value):null,medical:pMed.value.trim()};save();render()}
function appShell(){let dk=document.documentElement.dataset.theme==='dark',nb=(s,i,l)=>`<button class="nav-btn${s==='today'?' active':''}" data-screen="${s}" onclick="go('${s}')"><span class="nav-icon">${i}</span>${l}</button>`;return `<div class="app"><header class="topbar"><div class="topbar-row"><div><div class="brand">🍼 Baby Daily Tracker</div><div class="date">${new Date().toLocaleDateString(LOC(),{weekday:'long',month:'long',day:'numeric'})}</div></div><div style="display:flex;gap:6px"><button class="icon-btn" onclick="toggleLang()" aria-label="Language">${LANG()==='id'?'EN':'ID'}</button><button class="icon-btn" onclick="toggleTheme()" aria-label="Theme">${dk?'☀':'☾'}</button><button class="icon-btn" onclick="openProfile()" aria-label="Baby profile">${esc(state.profile.name).slice(0,1).toUpperCase()}</button></div></div></header><main class="content"><section id="screen-today" class="screen active"></section><section id="screen-history" class="screen"></section><section id="screen-insights" class="screen"></section><section id="screen-settings" class="screen"></section></main><nav class="bottomnav"><div class="nav-inner">${nb('today','⌂','Today')}${nb('history','▤','History')}${nb('insights','⌁','Insights')}${nb('settings','⚙','Settings')}</div></nav></div>`}
function go(s){activeScreen=s;document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));document.querySelector('#screen-'+s).classList.add('active');document.querySelectorAll('.nav-btn').forEach(x=>x.classList.toggle('active',x.dataset.screen===s));renderScreen()}
function renderScreen(){if(!state.profile)return;({today:renderToday,history:renderHistory,insights:renderInsights,settings:renderSettings})[activeScreen]();trDom(document.getElementById('screen-'+activeScreen));trDom(document.querySelector('.bottomnav'))}
function renderToday(){let a=ageFromDob(state.profile.dob),active=activeSleep(),ss=sleepSummary(),wk=awakeSince(),ev=dayEvents(),c=ty=>ev.filter(e=>ty.includes(e.type)).length,cur=active?`<div class="state-label">💤 Sleeping</div><div class="state-sub">Started ${fmtTime(active.start)} · ${dur(Date.now()-new Date(active.start))}</div>`:wk?`<div class="state-label">☀️ Awake</div><div class="state-sub">Awake for ${dur(Date.now()-wk)}</div>`:`<div class="state-label">Ready to record</div><div class="state-sub">Tap what happened next.</div>`,ch=(m,l)=>`<button type="button" class="${ago===m?'active':''}" onclick="setAgo(${m})">${l}</button>`,m=(v,l)=>`<div class="metric"><div class="metric-value">${v}</div><div class="metric-label">${l}</div></div>`,q=(f,e,l)=>`<button class="quick" onclick="${f}"><span class="emoji">${e}</span>${l}</button>`;document.querySelector('#screen-today').innerHTML=`<div class="hero"><div class="eyebrow">${esc(state.profile.name)}</div><h1>${a.months} months ${a.days} days</h1><div class="muted">${a.weeks} weeks ${a.wd} days${state.profile.ga&&state.profile.ga<37?' · Chronological age':''}</div></div><div class="state-card"><div class="state-main"><div>${cur}</div><div class="state-dot">${active?'💤':'☀️'}</div></div></div><button class="quick primary wide" style="width:100%;margin-bottom:10px" onclick="toggleSleep()"><span class="emoji">${active?'☀️':'💤'}</span>${active?'Wake':'Sleep'}</button><div class="tiny muted" style="margin-bottom:6px">When did it happen?</div><div class="segmented" style="grid-template-columns:repeat(4,1fr);margin-bottom:14px">${ch(0,'Now')}${ch(5,'5 min ago')}${ch(10,'10 min ago')}${ch(15,'15 min ago')}</div><div class="quick-grid">${q('openFeeding()','🍼','Milk')}${q('openMpasi()','🍽️','MPASI')}${q('openDiaper()','🧷','Diaper')}${q('openNote()','📝','Note')}</div>${ev.length||wk?`<div class="next"><div class="title">Next consideration</div><div>${esc(nextSleepText())}</div></div>`:''}<div class="section"><div style="display:flex;justify-content:space-between;align-items:center"><h2>Today at a glance</h2><span class="confidence">${ss.naps} completed naps</span></div><div class="summary-grid">${m(dur(ss.total),'Daytime sleep')}${m(c(['breastfeed','bottle','milk']),'Milk events')}${m(c(['mpasi']),'MPASI events')}${m(c(['diaper']),'Diaper events')}</div></div>${ss.naps&&new Date().getHours()>=15?`<div class="card"><h3>Bedtime consideration</h3><div class="muted" style="line-height:1.45">${esc(bedtimeText())}</div></div>`:''}<div class="section"><h2>Timeline</h2><div class="card timeline">${ev.length?[...ev].reverse().map(renderEvent).join(''):`<div class="empty">No events recorded yet today.<br>Tap an action above when something happens.</div>`}</div></div>`}
function renderEvent(e){return `<div class="event"><div class="event-time">${fmtTime(e.start)}</div><div class="event-dot">${eventIcon(e.type)}</div><div class="event-body"><div class="event-title">${eventTitle(e)} ${e.end?'':'<span class="pill">ongoing</span>'}</div><div class="event-detail">${esc(eventDetail(e)||'')}</div>${e.confidence==='estimated'?'<div><span class="confidence">Estimated</span></div>':''}<div class="event-actions"><button class="icon-btn" onclick="editEvent('${e.id}')">Edit</button><button class="icon-btn" onclick="deleteEvent('${e.id}')">Delete</button></div></div></div>`}
function openModal(title,body){modal.innerHTML=`<div class="modal-head"><h2 style="margin:0">${title}</h2><button class="modal-close" onclick="closeModal()">×</button></div>${body}`;trDom(modal);modalWrap.classList.add('show');modalWrap.setAttribute('aria-hidden','false')}
function closeModal(){modalWrap.classList.remove('show');modalWrap.setAttribute('aria-hidden','true')}
modalWrap.addEventListener('click',e=>{if(e.target===modalWrap)closeModal()});
function formTimeFields(e){let d=e?localParts(new Date(e.start)):localParts();return `<div class="row"><div class="field"><label>Date</label><input id="fDate" type="date" value="${d.date}" required></div><div class="field"><label>Time</label><input id="fTime" type="time" value="${d.time}" required></div></div><div class="field"><label>Confidence</label><div class="segmented"><button type="button" id="cConfirmed" onclick="setConf('confirmed')">Confirmed</button><button type="button" id="cEstimated" onclick="setConf('estimated')">Estimated</button></div></div>`}
let formConfidence='confirmed';function setConf(c){formConfidence=c;document.querySelectorAll('#cConfirmed,#cEstimated').forEach(x=>x.classList.toggle('active',x.id==='c'+c.charAt(0).toUpperCase()+c.slice(1)))}
function startSleep(){if(activeSleep()){toast('A sleep period is already running.');return}let d=nowISO(),p=localParts();let e={id:uid(),type:'sleep',start:d,end:null,date:p.date,confidence:'confirmed',createdAt:d};state.events.push(e);save();toast('Sleep started');renderScreen();tickTimer()}
function endSleep(){let e=activeSleep();if(!e)return;let d=nowISO();e.end=d;e.date=localParts(new Date(e.start)).date;save();toast(`Sleep recorded · ${dur(new Date(d)-new Date(e.start))}`);renderScreen()}
function recordWake(){let p=localParts();let active=activeSleep();if(active){endSleep();return}let e={id:uid(),type:'wake',start:nowISO(),date:p.date,confidence:'confirmed',createdAt:nowISO()};state.events.push(e);save();toast('Wake recorded');renderScreen()}
function openFeeding(existing=null){formConfidence=existing?.confidence||'confirmed';let e=existing;openModal(e?'Edit milk':'Record milk',`<form class="form" onsubmit="saveFeeding(event,'${e?.id||''}')">${formTimeFields(e)}<div class="field"><label>Type</label><select id="fType"><option value="breastfeed">Breastfeeding</option><option value="bottle">Bottle</option><option value="pump">Pumping</option></select></div><div id="feedExtra"></div><div class="field"><label>Notes <span class="muted">optional</span></label><textarea id="fNotes" rows="2">${esc(e?.notes||'')}</textarea></div><div class="btn-row"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn primary">Save</button></div></form>`);fType.value=e?.type||'breastfeed';updateFeedExtra(e);fType.onchange=()=>updateFeedExtra(null)}
function updateFeedExtra(e){let t=fType.value;feedExtra.innerHTML=t==='breastfeed'?`<div class="row"><div class="field"><label>Duration <span class="muted">optional</span></label><input id="fDuration" type="number" min="0" value="${e?.duration||''}" placeholder="minutes"></div><div class="field"><label>Side <span class="muted">optional</span></label><select id="fSide"><option value="">Not recorded</option><option>Left</option><option>Right</option><option>Both</option></select></div></div>`:t==='bottle'?`<div class="row"><div class="field"><label>Milk</label><select id="fKind"><option>Formula</option><option>Breast milk</option></select></div><div class="field"><label>Volume <span class="muted">optional</span></label><input id="fVolume" type="number" min="0" value="${e?.volume||''}" placeholder="ml"></div></div>`:`<div class="row"><div class="field"><label>Duration <span class="muted">optional</span></label><input id="fDuration" type="number" min="0" value="${e?.duration||''}" placeholder="minutes"></div><div class="field"><label>Volume <span class="muted">optional</span></label><input id="fVolume" type="number" min="0" value="${e?.volume||''}" placeholder="ml"></div></div>`;if(e?.side&&document.querySelector('#fSide'))fSide.value=e.side;if(e?.kind&&document.querySelector('#fKind'))fKind.value=e.kind;trDom(feedExtra)}
function saveFeeding(ev,id){ev.preventDefault();let type=fType.value,dt=parseLocal(fDate.value,fTime.value),e=id?state.events.find(x=>x.id===id):{id:uid(),createdAt:nowISO()};Object.assign(e,{type,start:dt.toISOString(),date:fDate.value,confidence:formConfidence,notes:fNotes.value.trim()});if(type==='breastfeed'){e.duration=Number(fDuration?.value)||null;e.side=fSide?.value||null;delete e.volume;delete e.kind}else if(type==='bottle'){e.kind=fKind.value;e.volume=Number(fVolume.value)||null;delete e.duration;delete e.side}else{e.duration=Number(fDuration.value)||null;e.volume=Number(fVolume.value)||null;delete e.side;delete e.kind}if(!id)state.events.push(e);save();closeModal();toast('Milk event saved');renderScreen()}
function openMpasi(existing=null){formConfidence=existing?.confidence||'confirmed';openModal(existing?'Edit MPASI':'Record MPASI',`<form class="form" onsubmit="saveSimple(event,'${existing?.id||''}','mpasi')">${formTimeFields(existing)}<div class="field"><label>Menu</label><input id="fMenu" value="${esc(existing?.menu||'')}" placeholder="e.g. rice, egg, avocado"></div><div class="row"><div class="field"><label>Texture <span class="muted">optional</span></label><input id="fTexture" value="${esc(existing?.texture||'')}" placeholder="mashed, soft, finger food"></div><div class="field"><label>Amount <span class="muted">optional</span></label><input id="fAmount" value="${esc(existing?.amount||'')}" placeholder="optional"></div></div><div class="field"><label>Response / possible reaction <span class="muted">optional</span></label><input id="fResponse" value="${esc(existing?.response||'')}" placeholder="liked it, gagged, rash, etc."></div><div class="notice">If there is swelling, trouble breathing, or repeated vomiting after a new food, seek urgent medical care.</div><div class="field"><label>Notes <span class="muted">optional</span></label><textarea id="fNotes" rows="2">${esc(existing?.notes||'')}</textarea></div><div class="btn-row"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn primary">Save</button></div></form>`);setConf(formConfidence)}
function openDiaper(existing=null){formConfidence=existing?.confidence||'confirmed';openModal(existing?'Edit diaper':'Record diaper',`<form class="form" onsubmit="saveSimple(event,'${existing?.id||''}','diaper')">${formTimeFields(existing)}<div class="field"><label>Type</label><select id="fKind"><option>Wet</option><option>Dirty</option><option>Both</option></select></div><div class="field"><label>Notes <span class="muted">optional</span></label><textarea id="fNotes" rows="2">${esc(existing?.notes||'')}</textarea></div><div class="btn-row"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn primary">Save</button></div></form>`);if(existing)fKind.value=existing.kind;setConf(formConfidence)}
function openNote(existing=null){formConfidence=existing?.confidence||'confirmed';openModal(existing?'Edit note':'Add note',`<form class="form" onsubmit="saveSimple(event,'${existing?.id||''}','note')">${formTimeFields(existing)}<div class="field"><label>Note</label><textarea id="fNotes" rows="5" required>${esc(existing?.notes||'')}</textarea></div><div class="btn-row"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn primary">Save</button></div></form>`);setConf(formConfidence)}
function saveSimple(ev,id,type){ev.preventDefault();let dt=parseLocal(fDate.value,fTime.value),e=id?state.events.find(x=>x.id===id):{id:uid(),createdAt:nowISO()};Object.assign(e,{type,start:dt.toISOString(),date:fDate.value,confidence:formConfidence,notes:fNotes?.value.trim()||''});if(type==='mpasi')Object.assign(e,{menu:fMenu.value.trim(),texture:fTexture.value.trim(),amount:fAmount.value.trim(),response:fResponse.value.trim()});if(type==='diaper')e.kind=fKind.value;if(!id)state.events.push(e);save();closeModal();toast('Event saved');renderScreen()}
function editEvent(id){let e=state.events.find(x=>x.id===id);if(!e)return;if(e.type==='sleep')openSleepEdit(e);else if(['breastfeed','bottle','pump'].includes(e.type))openFeeding(e);else if(e.type==='mpasi')openMpasi(e);else if(e.type==='diaper')openDiaper(e);else if(e.type==='note')openNote(e);else if(e.type==='wake')openWakeEdit(e)}
function openSleepEdit(e){formConfidence=e.confidence||'confirmed';openModal('Edit sleep',`<form class="form" onsubmit="saveSleepEdit(event,'${e.id}')">${formTimeFields(e)}<div class="field"><label>End time</label><div class="row"><input id="fEndDate" type="date" value="${e.end?localParts(new Date(e.end)).date:localParts().date}"><input id="fEndTime" type="time" value="${e.end?localParts(new Date(e.end)).time:localParts().time}"></div></div><div class="field"><label>Sleep type</label><select id="fKindS"><option value="nap">Nap</option><option value="night">Night sleep</option></select></div><div class="btn-row"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn primary">Save</button></div></form>`);setConf(formConfidence);fKindS.value=sleepKind(e)}
function saveSleepEdit(ev,id){ev.preventDefault();let e=state.events.find(x=>x.id===id),s=parseLocal(fDate.value,fTime.value),end=(fEndDate.value&&fEndTime.value)?parseLocal(fEndDate.value,fEndTime.value):null;if(end&&end<=s){toast('End time must be after start time.');return}e.start=s.toISOString();e.end=end?end.toISOString():null;e.date=fDate.value;e.confidence=formConfidence;e.kind=fKindS.value;save();closeModal();toast('Sleep corrected');renderScreen()}
function openWakeEdit(e){formConfidence=e.confidence||'confirmed';openModal('Edit wake',`<form class="form" onsubmit="saveWakeEdit(event,'${e.id}')">${formTimeFields(e)}<div class="btn-row"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn primary">Save</button></div></form>`);setConf(formConfidence)}
function saveWakeEdit(ev,id){ev.preventDefault();let e=state.events.find(x=>x.id===id),dt=parseLocal(fDate.value,fTime.value);e.start=dt.toISOString();e.date=fDate.value;e.confidence=formConfidence;save();closeModal();toast('Wake corrected');renderScreen()}
function deleteEvent(id){let e=state.events.find(x=>x.id===id);if(!e)return;if(!confirm(`Delete ${tx(eventTitle(e)).toLowerCase()} at ${fmtTime(e.start)}?`))return;state.events=state.events.filter(x=>x.id!==id);save();toast('Event deleted');renderScreen()}
function renderHistory(){let dates=[...new Set(state.events.map(e=>e.date))].sort((a,b)=>b.localeCompare(a));document.querySelector('#screen-history').innerHTML=`<div class="hero"><div class="eyebrow">Your record</div><h1>History</h1><div class="muted">Review previous days without turning them into a rigid schedule.</div></div><div class="card">${dates.length?dates.map(d=>{let ss=sleepSummary(d),ev=dayEvents(d),milk=ev.filter(e=>['breastfeed','bottle','milk'].includes(e.type)).length,mp=ev.filter(e=>e.type==='mpasi').length;return `<div class="day-row" onclick="openDay('${d}')"><div class="day-main"><div class="day-title">${fmtDate(d)}</div><div class="day-meta">${ss.naps} naps · ${dur(ss.total)} daytime sleep · ${milk} milk · ${mp} MPASI</div></div><span>›</span></div>`}).join(''):`<div class="empty">No previous events yet.</div>`}</div>`}
function openDay(date){let ev=dayEvents(date),ss=sleepSummary(date);openModal(fmtDate(date),`<div class="summary-grid"><div class="metric"><div class="metric-value">${dur(ss.total)}</div><div class="metric-label">Daytime sleep</div></div><div class="metric"><div class="metric-value">${ss.naps}</div><div class="metric-label">Naps</div></div></div><div class="section"><div class="card timeline">${ev.map(renderEvent).join('')||'<div class="empty">No events.</div>'}</div></div>`)}
function renderInsights(){let days=[...new Set(state.events.map(e=>e.date))].filter(d=>d!==today()&&sleepSummary(d).naps>0).sort().slice(-7),data=days.map(d=>({d,m:mins(sleepSummary(d).total)})),ms=data.map(x=>x.m),mx=Math.max(60,...ms),avg=ms.length?Math.round(ms.reduce((a,x)=>a+x,0)/ms.length):0,n=days.length;document.querySelector('#screen-insights').innerHTML=`<div class="hero"><div class="eyebrow">Patterns, not rules</div><h1>Insights</h1><div class="muted">Only recurring signals should be treated as patterns.</div></div>${n<3?`<div class="card"><h3>Not enough history yet</h3><div class="muted" style="line-height:1.5">${n} day${n===1?'':'s'} with completed naps recorded. A few days are needed before the app should call something a pattern.</div></div>`:`<div class="card"><h3>Daytime sleep — recent days</h3><div class="chart">${data.map(x=>`<div class="bar-wrap"><div class="bar-value">${dur(x.m*6e4)}</div><div class="bar" style="height:${Math.max(2,x.m/mx*100)}%"></div><div class="bar-label">${new Date(x.d+'T12:00:00').toLocaleDateString(LOC(),{weekday:'short'})}</div></div>`).join('')}</div><div class="summary-grid" style="margin-top:12px"><div class="metric"><div class="metric-value">${dur(avg*6e4)}</div><div class="metric-label">Recent average</div></div><div class="metric"><div class="metric-value">${dur(Math.min(...ms)*6e4)} – ${dur(Math.max(...ms)*6e4)}</div><div class="metric-label">Range</div></div></div></div><div class="card"><h3>How to read this</h3><div class="muted" style="line-height:1.5">Variation from one day to another is normal. Repeated changes across several days are more informative. This tracker does not diagnose overtiredness, undertiredness, feeding adequacy, or illness.</div></div>`}`}
function renderSettings(){let t=state.theme;document.querySelector('#screen-settings').innerHTML=`<div class="hero"><div class="eyebrow">Preferences & data</div><h1>Settings</h1></div><div class="card"><h3>Appearance</h3><div class="segmented"><button class="${t==='system'?'active':''}" onclick="setTheme('system')">System</button><button class="${t==='light'?'active':''}" onclick="setTheme('light')">Light</button><button class="${t==='dark'?'active':''}" onclick="setTheme('dark')">Dark</button></div></div><div class="card"><h3>Language</h3><div class="segmented" style="grid-template-columns:repeat(2,1fr)"><button class="${LANG()==='en'?'active':''}" onclick="setLang('en')">English</button><button class="${LANG()==='id'?'active':''}" onclick="setLang('id')">Bahasa Indonesia</button></div></div><div class="card"><div class="settings-item" onclick="openProfile()"><div><div class="settings-title">Baby profile</div><div class="settings-desc">${esc(state.profile.name)} · ${state.profile.feeding}</div></div><span>›</span></div><div class="settings-item" onclick="exportData()"><div><div class="settings-title">Export data</div><div class="settings-desc">Download a JSON backup of your local records.</div></div><span>↓</span></div><div class="settings-item" onclick="importData()"><div><div class="settings-title">Import data</div><div class="settings-desc">Restore a previously exported JSON backup.</div></div><span>↑</span></div><div class="settings-item" onclick="resetData()"><div><div class="settings-title danger-text">Clear all data</div><div class="settings-desc">Permanently remove the baby profile and events from this device.</div></div><span class="danger-text">×</span></div></div><div class="card"><div class="settings-item"><div><div class="settings-title">About</div><div class="settings-desc">Baby Daily Tracker · v1.0.0 · Local-first personal tracker.</div></div></div><div class="notice">Safety note: sleep guidance is informational. Always prioritise established safe-sleep practices and professional medical advice when a baby is unwell or symptoms are concerning.</div></div>`}
function setTheme(t){state.theme=t;save();applyTheme();renderSettings()}
function openProfile(){let p=state.profile;openModal('Baby profile',`<form class="form" onsubmit="saveProfile(event)">${profileFields()}<div class="btn-row"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn primary">Save profile</button></div></form>`);pSex.value=(p.sex==='male'||p.sex==='boy')?'boy':'girl';pFeed.value=p.feeding;pMpasi.value=p.mpasi||'not_started'}
function saveProfile(ev){ev.preventDefault();state.profile={...state.profile,name:pName.value.trim(),dob:pDob.value,sex:(pSex.value==='male'||pSex.value==='boy')?'boy':'girl',feeding:pFeed.value,mpasi:pMpasi.value,ga:pGa.value?Number(pGa.value):null,medical:pMed.value.trim()};save();closeModal();toast('Profile updated');renderScreen()}
function exportData(){let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`baby-daily-tracker-${today()}.json`;a.click();URL.revokeObjectURL(a.href);toast('Backup exported')}
function importData(){let i=document.createElement('input');i.type='file';i.accept='application/json';i.onchange=()=>{let f=i.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.profile||!Array.isArray(x.events))throw Error();if(!confirm('Replace current local data with this backup?'))return;state={...defaultState,...x};save();render();toast('Backup imported')}catch{toast('That file is not a valid Baby Daily Tracker backup.')}};r.readAsText(f)};i.click()}
function resetData(){if(!confirm('Clear the baby profile and all recorded events from this device? This cannot be undone unless you have an export.'))return;localStorage.removeItem(KEY);state={...defaultState};render()}
function toast(s){let t=document.getElementById('toast');if(!t)return;t.textContent=tx(s);t.classList.add('show');clearTimeout(window.__toast);window.__toast=setTimeout(()=>t.classList.remove('show'),2200)}
let tk;function tickTimer(){if(!tk)tk=setInterval(()=>{if(activeScreen==='today'&&!modalWrap.classList.contains('show'))renderScreen()},30000)}
window.addEventListener('storage',()=>{state=load();render()});matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change',()=>{if(state.theme==='system'){applyTheme();renderScreen()}});document.addEventListener('visibilitychange',()=>{if(!document.hidden)tickTimer()});
render();tickTimer();
</script>
</body>
</html>
